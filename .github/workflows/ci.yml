name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # unit tests (pure cores: position math, accidental inference,
      # playback extraction, layout walkers)
      - run: npm test
      # typechecks (tsc) then builds the library bundle
      - run: npm run build
      - run: npm run build-storybook
      # visual regression runs locally only for now: baselines are
      # OS-specific (see QUALITY.md, Testing)
